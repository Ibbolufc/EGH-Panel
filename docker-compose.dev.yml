services:
  postgres:
    image: postgres:16-alpine
    container_name: egh-panel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: egh
      POSTGRES_PASSWORD: egh_password
      POSTGRES_DB: egh_panel
    ports:
      - "5432:5432"
    volumes:
      - egh_panel_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egh -d egh_panel"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  egh_panel_postgres:
